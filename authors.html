<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исследователи ЛАИ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #2c3e50; }
        .nav-link { display: inline-block; margin-top: 10px; text-decoration: none; color: #3498db; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); }
        .author-name { font-size: 1.4em; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .role { color: #7f8c8d; font-style: italic; margin-bottom: 15px; }
        .hypotheses-list { list-style: none; padding: 0; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .hypotheses-list li { margin-bottom: 8px; }
        .hyp-link { cursor: pointer; color: #2980b9; font-weight: 500; text-decoration: underline; }
        .hyp-link:hover { color: #e67e22; }
        .tag { display: inline-block; background: #ecf0f1; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }

        /* Стили для модального окна */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 30px; border: 1px solid #888; width: 80%; max-width: 800px; border-radius: 12px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover, .close:focus { color: black; text-decoration: none; cursor: pointer; }
        .modal-title { color: #2c3e50; margin-top: 0; }
        .modal-meta { font-size: 0.9em; color: #7f8c8d; margin-bottom: 20px; }
        .modal-body { line-height: 1.6; }
    </style>
</head>
<body>

<header>
    <h1>👥 Исследователи Лаборатории Альтернативной Истории</h1>
    <a href="index.html" class="nav-link">← Вернуться к классификации гипотез</a>
</header>

<div id="authors-container" class="grid">
    <!-- Сюда будут загружаться карточки авторов -->
</div>

<!-- Модальное окно -->
<div id="hypothesisModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalMeta" class="modal-meta"></div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script>
    const REPO_OWNER = 'qqmats';
    const REPO_NAME = 'lai-hypothesis-bank';
    const AUTHORS_PATH = 'authors';
    const HYPOTHESES_PATH = 'hypotheses';

    // Элементы модального окна
    const modal = document.getElementById("hypothesisModal");
    const span = document.getElementsByClassName("close")[0];

    // Закрытие окна
    span.onclick = function() { modal.style.display = "none"; }
    window.onclick = function(event) { if (event.target == modal) { modal.style.display = "none"; } }

    async function loadAuthors() {
        try {
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${AUTHORS_PATH}`);
            const files = await response.json();
            const authorFiles = files.filter(file => file.name.endsWith('.json'));
                                   // Сортировка: Ручной порядок для ключевых авторов, остальные по алфавиту
            authorFiles.sort((a, b) => {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();
                
                // Определяем "вес" (приоритет) для каждого автора
                const getPriority = (name) => {
                    if (name.includes('sklyarov')) return 1; // Андрей Скляров - всегда первый
                    if (name.includes('pavlov')) return 2;   // Павел Павлов - второй
                    if (name.includes('sitchin')) return 3;  // Захария Ситчин - третий
                    if (name.includes('sergeev')) return 4;  // Степан Сергеев - четвертый
                    return 5;                                // Все остальные
                };

                const priorityA = getPriority(nameA);
                const priorityB = getPriority(nameB);

                // Сначала сравниваем по приоритету
                if (priorityA !== priorityB) {
                    return priorityA - priorityB;
                }

                // Если приоритет одинаковый (например, оба из группы "остальные"), сортируем по алфавиту
                if (nameA < nameB) return -1;
                if (nameA > nameB) return 1;
                return 0;
            });
            const container = document.getElementById('authors-container');

            for (const file of authorFiles) {
                const contentResponse = await fetch(file.download_url);
                const author = await contentResponse.json();

                const card = document.createElement('div');
                card.className = 'card';
                
                let hypothesesHtml = '';
                if (author.related_hypotheses && author.related_hypotheses.length > 0) {
                    hypothesesHtml = '<ul class="hypotheses-list">';
                    author.related_hypotheses.forEach(hypId => {
                        // При клике вызываем функцию открытия модалки
                        hypothesesHtml += `<li><span class="hyp-link" onclick="openHypothesis('${hypId}')">📄 ${hypId}</span></li>`;
                    });
                    hypothesesHtml += '</ul>';
                }

                card.innerHTML = `
                    <div class="author-name">${author.personal_info.name_ru}</div>
                    <div class="role">${author.role_in_lai.join(', ')}</div>
                    <p>${author.bio_summary || 'Описание отсутствует.'}</p>
                    <div>
                        ${author.specialization.map(spec => `<span class="tag">${spec}</span>`).join('')}
                    </div>
                    ${hypothesesHtml}
                `;
                container.appendChild(card);
            }
        } catch (error) { console.error('Ошибка загрузки авторов:', error); }
    }

    // Функция для загрузки и отображения гипотезы
    async function openHypothesis(hypId) {
        // Определяем сегмент из ID (например, LAI_SEG04-Sergeev_01 -> SEG04)
        const segment = hypId.split('-')[0].replace('LAI_', ''); 
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/hypotheses/${segment}/${hypId}.json`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Файл не найден');
            const data = await response.json();

            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalMeta').innerHTML = `
                <strong>ID:</strong> ${data.id} | 
                <strong>Статус:</strong> ${data.status} | 
                <strong>Уверенность:</strong> ${data.confidence_level}
            `;
            document.getElementById('modalBody').innerHTML = `
                <p><strong>Суть гипотезы:</strong> ${data.hypothesis_statement}</p>
                <p><strong>Описание:</strong> ${data.synopsis}</p>
                <p><strong>Ключевые слова:</strong> ${data.keywords.join(', ')}</p>
                <hr>
                <p><small>Источник: <a href="${data.main_source.url}" target="_blank">${data.main_source.title}</a></small></p>
            `;
            
            modal.style.display = "block";
        } catch (error) {
            alert(`Не удалось загрузить гипотезу ${hypId}. Проверьте правильность пути.`);
            console.error(error);
        }
    }

    loadAuthors();
    // Обработка нажатия клавиши Esc для закрытия модального окна
document.addEventListener('keydown', function(event) {
    if (event.key === "Escape") {
        modal.style.display = "none";
    }
});
</script>

</body>
</html>
