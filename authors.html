<script>
    const REPO_OWNER = 'qqmats';
    const REPO_NAME = 'lai-hypothesis-bank';
    const AUTHORS_PATH = 'authors';

    // Элементы модального окна
    const modal = document.getElementById("hypothesisModal");
    const span = document.getElementsByClassName("close")[0];

    // Закрытие окна
    span.onclick = function() { modal.style.display = "none"; }
    window.onclick = function(event) { if (event.target == modal) { modal.style.display = "none"; } }
    
    // Обработка Esc
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            modal.style.display = "none";
        }
    });

    async function loadAuthors() {
        const container = document.getElementById('authors-container');
        container.innerHTML = '<p style="text-align:center;">Загрузка данных...</p>';

        try {
            // 1. Получаем список файлов из папки authors
            console.log(`Запрос списка файлов: https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${AUTHORS_PATH}`);
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${AUTHORS_PATH}`);
            
            if (!response.ok) {
                throw new Error(`Ошибка сети: ${response.status} ${response.statusText}`);
            }

            const files = await response.json();
            
            // Фильтруем только JSON файлы и исключаем шаблоны
            const authorFiles = files.filter(file => 
                file.name.endsWith('.json') && 
                !file.name.includes('Template') && 
                !file.name.includes('_update')
            );

            // Сортировка: Андрей Скляров всегда первый
            authorFiles.sort((a, b) => {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();
                if (nameA.includes('sklyarov')) return -1;
                if (nameB.includes('sklyarov')) return 1;
                if (nameA < nameB) return -1;
                if (nameA > nameB) return 1;
                return 0;
            });

            container.innerHTML = ''; // Очищаем индикатор загрузки

            for (const file of authorFiles) {
                try {
                    // 2. Загружаем содержимое каждого файла автора
                    console.log(`Загрузка профиля: ${file.name}`);
                    const contentResponse = await fetch(file.download_url);
                    
                    if (!contentResponse.ok) {
                        console.warn(`Не удалось загрузить ${file.name}: ${contentResponse.status}`);
                        continue;
                    }

                    const text = await contentResponse.text();
                    if (!text.trim()) {
                        console.warn(`Файл ${file.name} пуст.`);
                        continue;
                    }

                    const author = JSON.parse(text);

                    // 3. Создаем HTML карточку
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let hypothesesHtml = '';
                    if (author.related_hypotheses && author.related_hypotheses.length > 0) {
                        hypothesesHtml = '<ul class="hypotheses-list">';
                        author.related_hypotheses.forEach(hypId => {
                            hypothesesHtml += `<li><span class="hyp-link" onclick="openHypothesis('${hypId}')">📄 ${hypId}</span></li>`;
                        });
                        hypothesesHtml += '</ul>';
                    }

                    card.innerHTML = `
                        <div class="author-name">${author.personal_info?.name_ru || author.id}</div>
                        <div class="role">${Array.isArray(author.role_in_lai) ? author.role_in_lai.join(', ') : ''}</div>
                        <p>${author.bio_summary || 'Описание отсутствует.'}</p>
                        <div>
                            ${(author.specialization || []).map(spec => `<span class="tag">${spec}</span>`).join('')}
                        </div>
                        <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                            <a href="editor.html?type=profile&id=${author.id.replace('AUTH-', '')}" 
                               style="font-size: 0.85em; color: #e67e22; text-decoration: none; font-weight: bold;">
                                ✏️ Изменить профиль
                            </a>
                        </div>
                        ${hypothesesHtml}
                    `;
                    
                    container.appendChild(card);
                } catch (fileError) {
                    console.error(`Ошибка обработки файла ${file.name}:`, fileError);
                }
            }
            
            if (container.children.length === 0) {
                container.innerHTML = '<p>Профили авторов не найдены.</p>';
            }

        } catch (error) {
            console.error('Критическая ошибка загрузки авторов:', error);
            container.innerHTML = `<p style="color:red;">Ошибка: ${error.message}. Проверьте консоль (F12).</p>`;
        }
    }

    // Функция для загрузки и отображения гипотезы
    async function openHypothesis(hypId) {
        const segment = hypId.split('-')[0].replace('LAI_', ''); 
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/hypotheses/${segment}/${hypId}.json`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Файл не найден');
            
            const text = await response.text();
            const data = JSON.parse(text);

            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalMeta').innerHTML = `
                <strong>ID:</strong> ${data.id} | 
                <strong>Статус:</strong> ${data.status} | 
                <strong>Уверенность:</strong> ${data.confidence_level}
            `;
            document.getElementById('modalBody').innerHTML = `
                <p><strong>Суть гипотезы:</strong> ${data.hypothesis_statement}</p>
                <p><strong>Описание:</strong> ${data.synopsis}</p>
                <p><strong>Ключевые слова:</strong> ${data.keywords.join(', ')}</p>
                <hr>
                <p><small>Источник: <a href="${data.main_source.url}" target="_blank">${data.main_source.title}</a></small></p>
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc;">
                    <a href="editor.html?type=hypothesis&id=${data.id}" 
                       target="_blank"
                       style="display: inline-block; padding: 8px 15px; background: #f39c12; color: white; border-radius: 4px; text-decoration: none; font-size: 0.9em;">
                        ✏️ Предложить корректировку
                    </a>
                </div>
            `;
            
            modal.style.display = "block";
        } catch (error) {
            alert(`Не удалось загрузить гипотезу ${hypId}.`);
            console.error(error);
        }
    }

    loadAuthors();
</script>
