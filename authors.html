<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исследователи ЛАИ</title>
    <!-- Подключаем Bootstrap для красивого оформления -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем иконки FontAwesome для кнопок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .author-card { transition: transform 0.2s; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .author-card:hover { transform: translateY(-5px); }
        .card-header { background-color: #2c3e50; color: white; font-weight: bold; }
        .badge-role { margin-right: 5px; }
        .btn-social { width: 40px; height: 40px; padding: 0; line-height: 40px; text-align: center; border-radius: 50%; }
        .btn-telegram { background-color: #0088cc; color: white; border: none; }
        .btn-telegram:hover { background-color: #0077b5; color: white; }
        .btn-web { background-color: #6c757d; color: white; border: none; }
        .btn-web:hover { background-color: #5a6268; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-4 text-center">👥 Исследователи Лаборатории Альтернативной Истории</h1>
            <p class="lead text-center text-muted">Профили участников проекта и их вклад в альтернативную историю.</p>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-outline-primary">← Вернуться к классификации гипотез</a>
            </div>
        </div>
    </div>

    <div id="authors-container" class="row g-4">
        <!-- Сюда будут загружаться карточки авторов -->
        <div class="text-center">Загрузка профилей...</div>
    </div>
</div>

<script>
    // Функция для загрузки данных из JSON файлов
    async function loadAuthors() {
        const container = document.getElementById('authors-container');
        
        // Список ID авторов, которые у нас есть в системе
        // В будущем этот список можно будет генерировать автоматически, сканируя папку authors/
        const authorIds = [
            'AUTH-Sklyarov',
            'AUTH-Sergeev',
            'AUTH-Sitchin',
            'AUTH-Hapgood',
            'AUTH-Mosov',
            'AUTH-Lagun'
        ];

        let htmlContent = '';

        for (const id of authorIds) {
            try {
                // Загружаем файл профиля автора
                const response = await fetch(`authors/${id}.json`);
                if (!response.ok) throw new Error('Файл не найден');
                const author = await response.json();

                // Генерируем HTML для карточки автора
                htmlContent += createAuthorCard(author);
            } catch (error) {
                console.warn(`Не удалось загрузить профиль ${id}:`, error);
            }
        }

        container.innerHTML = htmlContent || '<div class="alert alert-warning">Профили авторов не найдены.</div>';
    }

    // Функция создания HTML-карточки автора
    function createAuthorCard(author) {
        // Формируем бейджи ролей
        const rolesBadges = author.role_in_lai.map(role => 
            `<span class="badge bg-secondary badge-role">${role}</span>`
        ).join('');

        // Формируем список специализаций
        const specsList = author.specialization.map(spec => 
            `<li class="list-group-item small">${spec}</li>`
        ).join('');

        // --- НОВЫЙ БЛОК: Генерация кнопок социальных сетей ---
        let socialButtons = '';
        
        if (author.contacts && author.contacts.telegram) {
            socialButtons += `
                <a href="${author.contacts.telegram}" target="_blank" class="btn btn-social btn-telegram me-2" title="Telegram">
                    <i class="fab fa-telegram-plane"></i>
                </a>`;
        }

        if (author.contacts && author.contacts.official_page) {
            socialButtons += `
                <a href="${author.contacts.official_page}" target="_blank" class="btn btn-social btn-web" title="Официальная страница">
                    <i class="fas fa-globe"></i>
                </a>`;
        }
        // -----------------------------------------------------

        return `
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 author-card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>${author.personal_info.name_ru}</span>
                    <small>${author.personal_info.birth_year || ''} – ${author.personal_info.death_year || 'н.в.'}</small>
                </div>
                <div class="card-body">
                    <p class="card-text text-muted">${author.bio_summary}</p>
                    
                    <div class="mb-3">
                        ${rolesBadges}
                    </div>

                    <h6 class="card-subtitle mb-2 text-muted">Специализация:</h6>
                    <ul class="list-group list-group-flush mb-3">
                        ${specsList}
                    </ul>

                    <div class="mt-auto pt-2 border-top d-flex align-items-center">
                        <span class="me-2 text-muted small">Контакты:</span>
                        ${socialButtons}
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <small class="text-muted">ID: ${author.id}</small>
                </div>
            </div>
        </div>
        `;
    }

    // Запускаем загрузку при открытии страницы
    document.addEventListener('DOMContentLoaded', loadAuthors);
</script>

</body>
</html>
