<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исследователи ЛАИ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        .authors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .author-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            transition: transform 0.2s;
        }

        .author-card:hover {
            transform: translateY(-5px);
        }

        .author-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .author-role {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .author-bio {
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        /* Стили для модуля кнопок контактов */
        .author-contact-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
        }

        .contact-btn.telegram {
            background-color: #0088cc; /* Цвет Telegram */
        }

        .contact-btn.official {
            background-color: #2c3e50; /* Нейтральный темный цвет */
        }

        .contact-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .contact-icon {
            margin-right: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Вернуться к классификации гипотез</a>
    <h1>👥 Исследователи Лаборатории Альтернативной Истории</h1>

    <div id="authors-container" class="authors-grid">
        <!-- Карточки авторов будут загружены сюда -->
    </div>

    <script>
        // Данные авторов (в реальном проекте это может быть отдельный JSON файл)
        const authorsData = [
            {
                "id": "AUTH-Sklyarov",
                "personal_info": {
                    "name_ru": "Андрей Скляров",
                    "name_en": "Andrey Sklyarov"
                },
                "role_in_lai": ["Основатель", "Исследователь"],
                "bio_summary": "Инженер-физик, основатель ЛАИ. Автор множества книг и фильмов об альтернативной истории.",
                "contacts": {
                    "telegram": "", 
                    "official_page": "https://lah.ru/"
                }
            },
            {
                "id": "AUTH-Sergeev",
                "personal_info": {
                    "name_ru": "Степан Сергеев",
                    "name_en": "Stepan Sergeev"
                },
                "role_in_lai": ["Исследователь", "Эксперт по генетике"],
                "bio_summary": "Специалист в области биоинженерии и генетики древних цивилизаций.",
                "contacts": {
                    "telegram": "https://t.me/example_sergeev", 
                    "official_page": ""
                }
            },
            {
                "id": "AUTH-Lagun",
                "personal_info": {
                    "name_ru": "Дмитрий Лагун",
                    "name_en": "Dmitry Lagun"
                },
                "role_in_lai": ["Исследователь", "Физик"],
                "bio_summary": "Исследует акустические и физические свойства древних сооружений.",
                "contacts": {
                    "telegram": "", 
                    "official_page": ""
                }
            }
        ];

        // Функция для создания кнопок контактов
        function renderContactButtons(authorData) {
            const container = document.createElement('div');
            container.className = 'author-contact-buttons';

            // Проверяем наличие ссылок в объекте contacts
            if (authorData.contacts) {
                // Кнопка Telegram
                if (authorData.contacts.telegram && authorData.contacts.telegram.trim() !== "") {
                    const tgBtn = document.createElement('a');
                    tgBtn.href = authorData.contacts.telegram;
                    tgBtn.target = "_blank";
                    tgBtn.className = "contact-btn telegram";
                    tgBtn.innerHTML = '<span class="contact-icon">✈️</span> Telegram';
                    container.appendChild(tgBtn);
                }

                // Кнопка Официальной страницы
                if (authorData.contacts.official_page && authorData.contacts.official_page.trim() !== "") {
                    const offBtn = document.createElement('a');
                    offBtn.href = authorData.contacts.official_page;
                    offBtn.target = "_blank";
                    offBtn.className = "contact-btn official";
                    offBtn.innerHTML = '<span class="contact-icon">🌐</span> Официальный сайт';
                    container.appendChild(offBtn);
                }
            }

            return container;
        }

        function loadAuthors() {
            const container = document.getElementById('authors-container');
            
            authorsData.forEach(author => {
                const card = document.createElement('div');
                card.className = 'author-card';

                // Создаем кнопки контактов
                const buttonsModule = renderContactButtons(author);

                card.innerHTML = `
                    <div class="author-name">${author.personal_info.name_ru}</div>
                    <div class="author-role">${author.role_in_lai.join(', ')}</div>
                    <div class="author-bio">${author.bio_summary}</div>
                    <div id="contact-buttons-container"></div>
                `;

                // Находим контейнер внутри созданной карточки и вставляем кнопки
                const buttonsContainer = card.querySelector('#contact-buttons-container');
                if (buttonsContainer) {
                    buttonsContainer.appendChild(buttonsModule);
                }

                container.appendChild(card);
            });
        }

        // Запуск загрузки при открытии страницы
        document.addEventListener('DOMContentLoaded', loadAuthors);
    </script>
</body>
</html>
