<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исследователи ЛАИ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #2c3e50; }
        .nav-link { display: inline-block; margin-top: 10px; text-decoration: none; color: #3498db; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .author-name { font-size: 1.4em; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .role { color: #7f8c8d; font-style: italic; margin-bottom: 15px; }
        .hypotheses-list { list-style: none; padding: 0; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .hypotheses-list li { margin-bottom: 8px; }
        .hypotheses-list a { text-decoration: none; color: #2980b9; font-size: 0.9em; }
        .hypotheses-list a:hover { text-decoration: underline; }
        .tag { display: inline-block; background: #ecf0f1; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
    </style>
</head>
<body>

<header>
    <h1>👥 Исследователи Лаборатории Альтернативной Истории</h1>
    <a href="index.html" class="nav-link">← Вернуться к классификации гипотез</a>
</header>

<div id="authors-container" class="grid">
    <!-- Сюда будут загружаться карточки авторов -->
</div>

<script>
    const REPO_OWNER = 'qqmats'; // Ваш никнейм
    const REPO_NAME = 'lai-hypothesis-bank';
    const AUTHORS_PATH = 'authors';

       async function loadAuthors() {
        try {
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${AUTHORS_PATH}`);
            const files = await response.json();
            const authorFiles = files.filter(file => file.name.endsWith('.json'));

            // Загружаем все профили параллельно для ускорения
            const authorsData = await Promise.all(
                authorFiles.map(async (file) => {
                    const res = await fetch(file.download_url);
                    return await res.json();
                })
            );

            // СОРТИРОВКА: Скляров первый, остальные по алфавиту (по имени)
            authorsData.sort((a, b) => {
                if (a.id === 'AUTH-Sklyarov') return -1;
                if (b.id === 'AUTH-Sklyarov') return 1;
                return a.personal_info.name_ru.localeCompare(b.personal_info.name_ru, 'ru');
            });

            const container = document.getElementById('authors-container');
            container.innerHTML = ''; // Очистка перед рендерингом

            for (const author of authorsData) {
                const card = document.createElement('div');
                card.className = 'card';
                
                let hypothesesHtml = '';
                if (author.related_hypotheses && author.related_hypotheses.length > 0) {
                    hypothesesHtml = '<ul class="hypotheses-list">';
                    author.related_hypotheses.forEach(hypId => {
                        hypothesesHtml += `<li><a href="index.html#${hypId}" target="_blank">📄 ${hypId}</a></li>`;
                    });
                    hypothesesHtml += '</ul>';
                }

                card.innerHTML = `
                    <div class="author-name">${author.personal_info.name_ru}</div>
                    <div class="role">${author.role_in_lai.join(', ')}</div>
                    <p>${author.bio_summary || 'Описание отсутствует.'}</p>
                    <div>
                        ${author.specialization.map(spec => `<span class="tag">${spec}</span>`).join('')}
                    </div>
                    ${hypothesesHtml}
                `;
                container.appendChild(card);
            }
        } catch (error) {
            console.error('Ошибка загрузки авторов:', error);
            document.getElementById('authors-container').innerHTML = '<p>Не удалось загрузить данные.</p>';
        }
    }

    loadAuthors();
</script>

</body>
</html>
