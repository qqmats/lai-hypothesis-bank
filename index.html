<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк гипотез ЛАИ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #2c3e50; }
        .filters { text-align: center; margin-bottom: 30px; }
        .filter-btn { padding: 8px 16px; margin: 0 5px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 20px; transition: 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: #3498db; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { margin-top: 0; color: #2980b9; font-size: 1.2em; }
        .meta { font-size: 0.85em; color: #7f8c8d; margin-bottom: 10px; }
        .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .status.draft { background: #f1c40f; color: #fff; }
        .status.confirmed { background: #2ecc71; color: #fff; }
        .btn-link { display: inline-block; margin-top: 15px; text-decoration: none; color: #3498db; font-weight: bold; }
        #loading { text-align: center; font-size: 1.2em; color: #7f8c8d; }
    </style>
</head>
<body>

<header>
    <h1>🏛️ Банк гипотез ЛАИ</h1>
    <p>Систематизация знаний Лаборатории Альтернативной Истории</p>
</header>

<div class="filters" id="segmentFilters">
    <button class="filter-btn active" onclick="filterHypotheses('all')">Все</button>
    <!-- Кнопки сегментов будут добавлены через JS -->
</div>

<div id="loading">Загрузка гипотез...</div>
<div class="grid" id="hypothesisGrid"></div>

<script>
    const repoUser = 'qqmats';
    const repoName = 'lai-hypothesis-bank';
    const branch = 'main'; // Или 'master', если ваша основная ветка называется так

    const segments = {
        "SEG01": "Мегалиты", "SEG02": "Геоинженерия", "SEG03": "Артефакты",
        "SEG04": "Биология", "SEG05": "Физика", "SEG06": "Биоинженерия",
        "SEG07": "IT и Вычисления", "SEG08": "Социальная инженерия",
        "SEG09": "Прочее", "SEG10": "Фундаментальные знания"
    };

    let allHypotheses = [];

    async function loadHypotheses() {
        const loading = document.getElementById('loading');
        
        try {
            // 1. Получаем список всех файлов в репозитории
            const apiUrl = `https://api.github.com/repos/${repoUser}/${repoName}/git/trees/${branch}?recursive=1`;
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
            }

            const data = await response.json();
            
            // 2. Фильтруем только JSON файлы из папки hypotheses
            const jsonFiles = data.tree.filter(item => 
                item.path.startsWith('hypotheses/') && item.path.endsWith('.json') && item.type === 'blob'
            );

            if (jsonFiles.length === 0) {
                loading.innerText = 'В репозитории не найдено файлов гипотез.';
                return;
            }

            // 3. Загружаем содержимое каждого файла параллельно
            const promises = jsonFiles.map(async file => {
                const rawUrl = `https://raw.githubusercontent.com/${repoUser}/${repoName}/${branch}/${file.path}`;
                const res = await fetch(rawUrl);
                if (!res.ok) return null;
                return res.json();
            });

            const results = await Promise.all(promises);
            
            // Фильтруем null (если какие-то файлы не загрузились)
            allHypotheses = results.filter(h => h !== null);
            
            createFilterButtons();
            renderHypotheses(allHypotheses);
            loading.style.display = 'none';

        } catch (error) {
            console.error(error);
            loading.innerHTML = `
                <p><strong>Ошибка загрузки данных.</strong></p>
                <p>Возможно, превышен лимит запросов к GitHub API.</p>
                <p>Попробуйте обновить страницу через пару минут.</p>
                <small>${error.message}</small>
            `;
        }
    }

    function createFilterButtons() {
        const container = document.getElementById('segmentFilters');
        container.innerHTML = '<button class="filter-btn active" onclick="filterHypotheses(\'all\')">Все</button>';
        
        Object.keys(segments).forEach(seg => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.innerText = segments[seg];
            btn.onclick = () => filterHypotheses(seg);
            container.appendChild(btn);
        });
    }

    function renderHypotheses(list) {
        const grid = document.getElementById('hypothesisGrid');
        grid.innerHTML = '';
        
        if (list.length === 0) {
            grid.innerHTML = '<p style="text-align:center; width:100%;">Нет гипотез для отображения.</p>';
            return;
        }

        list.forEach(hyp => {
            // Извлекаем сегмент из ID (например, LAI_SEG01-Sklyarov_01 -> SEG01)
            const segmentId = hyp.id ? hyp.id.split('-')[0].split('_')[0] : 'Unknown';
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="meta">${hyp.id || 'Без ID'} | ${hyp.authors && hyp.authors[0] ? hyp.authors[0].name : 'Неизвестный автор'}</div>
                <h3>${hyp.title || 'Без названия'}</h3>
                <span class="status ${hyp.status || 'draft'}">${hyp.status || 'draft'}</span>
                <p>${hyp.synopsis ? hyp.synopsis.substring(0, 150) + '...' : 'Описание отсутствует'}</p>
                <a href="https://github.com/${repoUser}/${repoName}/blob/${branch}/hypotheses/${segmentId}/${hyp.id}.json" target="_blank" class="btn-link">Открыть карточку →</a>
            `;
            grid.appendChild(card);
        });
    }

    function filterHypotheses(segment) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        if (segment === 'all') {
            renderHypotheses(allHypotheses);
        } else {
            const filtered = allHypotheses.filter(h => h.id && h.id.includes(segment));
            renderHypotheses(filtered);
        }
    }

    // Запуск
    loadHypotheses();
</script>
</body>
</html>
