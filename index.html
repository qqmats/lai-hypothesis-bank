<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк гипотез ЛАИ</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f4f4f9; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #2c3e50; }
        
        /* Навигация */
        .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .nav button { padding: 10px 20px; border: none; background: #ddd; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .nav button.active { background: #3498db; color: white; }

        /* Карточки */
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2980b9; }
        .meta { font-size: 0.9em; color: #7f8c8d; margin-bottom: 10px; }
        .tag { display: inline-block; background: #ecf0f1; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
        
        /* Секции */
        .section { display: none; }
        .section.active { display: block; }
        
        .author-link { color: #3498db; text-decoration: none; font-weight: bold; cursor: pointer; }
        .author-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <h1>🏛️ Банк гипотез ЛАИ</h1>
    <p>Систематизация знаний Лаборатории Альтернативной Истории</p>
</header>

<div class="nav">
    <button id="btn-hyp" class="active" onclick="showSection('hypotheses')">Гипотезы</button>
    <button id="btn-auth" onclick="showSection('authors')">Авторы</button>
</div>

<div id="hypotheses" class="section active">
    <h2>Список гипотез</h2>
    <div id="hyp-list">Загрузка...</div>
</div>

<div id="authors" class="section">
    <h2>Исследователи ЛАИ</h2>
    <div id="auth-list">Загрузка...</div>
</div>

<script>
    const REPO = 'qqmats/lai-hypothesis-bank';
    const BRANCH = 'main';

    function showSection(id) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById(id === 'hypotheses' ? 'btn-hyp' : 'btn-auth').classList.add('active');
    }

    // Загрузка гипотез
    async function loadHypotheses() {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/hypotheses?ref=${BRANCH}`);
            const segments = await res.json();
            let allHyps = [];

            for (let seg of segments) {
                if (seg.type === 'dir') {
                    const segRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${seg.path}?ref=${BRANCH}`);
                    const files = await segRes.json();
                    const jsonFiles = files.filter(f => f.name.endsWith('.json'));
                    
                    for (let file of jsonFiles) {
                        const contentRes = await fetch(file.download_url);
                        const data = await contentRes.json();
                        allHyps.push(data);
                    }
                }
            }
            
            renderHypotheses(allHyps);
        } catch (e) { console.error(e); document.getElementById('hyp-list').innerText = 'Ошибка загрузки.'; }
    }

    function renderHypotheses(list) {
        const container = document.getElementById('hyp-list');
        container.innerHTML = '';
        list.forEach(h => {
            const authors = h.authors.map(a => a.name).join(', ');
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h3>${h.title}</h3>
                <div class="meta">ID: ${h.id} | Автор: ${authors} | Статус: ${h.status}</div>
                <p>${h.synopsis.substring(0, 150)}...</p>
                <div>${h.keywords.map(k => `<span class="tag">${k}</span>`).join('')}</div>
            `;
            container.appendChild(div);
        });
    }

    // Загрузка авторов
    async function loadAuthors() {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/authors?ref=${BRANCH}`);
            const files = await res.json();
            const authors = [];

            for (let file of files) {
                if (file.name.endsWith('.json')) {
                    const contentRes = await fetch(file.download_url);
                    const data = await contentRes.json();
                    authors.push(data);
                }
            }
            renderAuthors(authors);
        } catch (e) { console.error(e); document.getElementById('auth-list').innerText = 'Ошибка загрузки.'; }
    }

    async function renderAuthors(list) {
        const container = document.getElementById('auth-list');
        container.innerHTML = '';
        
        for (let a of list) {
            // Загружаем гипотезы автора для отображения их количества
            const hyps = await getAuthorHypotheses(a.related_hypotheses || []);
            
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h3>${a.personal_info.name_ru}</h3>
                <div class="meta">${a.role_in_lai.join(', ')}</div>
                <p>${a.bio_summary}</p>
                <p><strong>Гипотез в банке:</strong> ${hyps.length}</p>
                <details>
                    <summary class="author-link">Показать работы</summary>
                    <ul style="margin-top:10px; padding-left:20px;">
                        ${hyps.map(h => `<li><a href="https://github.com/${REPO}/blob/${BRANCH}/${h.id.split('-')[0].replace('LAI_', 'hypotheses/')}/${h.id}.json" target="_blank">${h.title}</a></li>`).join('')}
                    </ul>
                </details>
            `;
            container.appendChild(div);
        }
    }

    async function getAuthorHypotheses(ids) {
        let found = [];
        // В реальном проекте лучше иметь кэш, но здесь мы просто пройдемся по всем файлам
        // Для упрощения пока вернем заглушку или простой поиск, если IDs известны
        // Чтобы не перегружать API, в этой версии мы просто отобразим ID
        return ids.map(id => ({id: id, title: "Загрузка названия..."})); 
    }

    // Инициализация
    loadHypotheses();
    loadAuthors();
</script>

</body>
</html>
