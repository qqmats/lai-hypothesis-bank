<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк гипотез ЛАИ</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .filter-buttons button { margin-right: 5px; padding: 5px 10px; cursor: pointer; }
        .hypothesis-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .hypothesis-meta { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        
        /* Стили для активной ссылки на автора */
        .author-link {
            color: #0366d6;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }

        /* Стили для кнопок контактов */
        .btn-link {
            display: inline-block;
            padding: 5px 10px;
            margin-right: 5px;
            text-decoration: none;
            background-color: #f0f0f0;
            border-radius: 4px;
            font-size: 0.9em;
            color: #333;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .btn-link:hover { background-color: #e0e0e0; }

        /* Стили модального окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 8px;
            max-width: 600px; width: 90%; position: relative;
            max-height: 80vh; overflow-y: auto;
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px;
            font-size: 24px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏛️ Банк гипотез ЛАИ</h1>
        <a href="authors.html">👥 Список авторов</a>
    </div>
    <p>Систематизация знаний Лаборатории Альтернативной Истории 7</p>
    
    <div class="filter-buttons">
        <button onclick="renderHypotheses('all')">Все</button>
        <!-- Кнопки сегментов будут здесь -->
    </div>

    <div id="hypotheses-container">Загрузка гипотез...</div>

    <!-- Модальное окно профиля автора -->
    <div id="authorModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAuthorModal()">&times;</span>
            <div id="modalBody">
                <p>Загрузка профиля...</p>
            </div>
        </div>
    </div>

    <script>
        // Основная функция отрисовки (упрощенная версия для примера)
        async function renderHypotheses(filter = 'all') {
            const container = document.getElementById('hypotheses-container');
            container.innerHTML = 'Загрузка...';
            
            // Здесь должен быть ваш код загрузки JSON-файлов из папки hypotheses/
            // Для примера предположим, что у нас есть массив данных hypData
            
            // Пример того, как теперь должна выглядеть карточка:
            let html = '';
            // ... цикл по гипотезам ...
            // const authorId = hyp.authors[0].id; // Например, AUTH-Alekseev
            // const authorName = hyp.authors[0].name; // Например, Игорь Алексеев

            html += `
            <div class="hypothesis-card">
                <div class="hypothesis-meta">
                    <span class="hyp-id">${hyp.id}</span> | 
                    <a href="#" onclick="openAuthorModal('${authorId}'); return false;" class="author-link">
                        ${authorName}
                    </a>
                </div>
                <h3>${hyp.title}</h3>
                <p>${hyp.synopsis}</p>
            </div>`;
            
            container.innerHTML = html;
        }

        // Функция открытия модального окна
        async function openAuthorModal(authorId) {
            const modal = document.getElementById('authorModal');
            const modalBody = document.getElementById('modalBody');
            
            modal.style.display = 'flex';
            modalBody.innerHTML = '<p>Загрузка профиля...</p>';

            try {
                const response = await fetch(`authors/${authorId}.json`);
                if (!response.ok) throw new Error('Файл не найден');
                
                const author = await response.json();
                
                let content = `
                    <h2>${author.personal_info.name_ru}</h2>
                    <p><strong>Роль:</strong> ${author.role_in_lai.join(', ')}</p>
                    <p><strong>Специализация:</strong> ${author.specialization.join(', ')}</p>
                    <p>${author.bio_summary}</p>
                    
                    <div class="author-links" style="margin-top: 15px;">
                        <a href="${author.contacts.telegram}" target="_blank" class="btn-link">📱 Telegram/VK</a>
                        <a href="${author.contacts.official_page}" target="_blank" class="btn-link">🌐 Сайт</a>
                        <button onclick="copyToClipboard('${author.contacts.email}')" class="btn-link">📧 Копировать email</button>
                    </div>
                `;
                
                modalBody.innerHTML = content;
            } catch (error) {
                modalBody.innerHTML = `<p style="color:red">Ошибка загрузки профиля: ${error.message}</p>`;
            }
        }

        function closeAuthorModal() {
            document.getElementById('authorModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('authorModal');
            if (event.target == modal) closeAuthorModal();
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                alert('Email скопирован!');
            });
        }
        
        // Запуск при загрузке
        renderHypotheses();
    </script>
</body>
</html>
