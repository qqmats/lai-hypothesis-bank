<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк гипотез ЛАИ</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #f4f6f7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        
        /* Панель управления */
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { 
            padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; 
            background: white; color: var(--primary); font-weight: bold; transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover, button.active { background: var(--primary); color: white; transform: translateY(-2px); }

        /* Сетка контента */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* Карточки */
        .card { 
            background: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .tag { 
            display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.8em; 
            background: #ecf0f1; color: #7f8c8d; margin-top: 10px;
        }
        .status-draft { border-left: 4px solid #95a5a6; }
        .status-confirmed { border-left: 4px solid #27ae60; }
        
        /* Модальное окно */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto;
        }
        .modal-content { 
            background: white; margin: 5% auto; padding: 30px; width: 80%; max-width: 800px; 
            border-radius: 15px; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
        
        .loading { text-align: center; font-style: italic; color: #7f8c8d; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <h1>🏛️ Банк гипотез ЛАИ</h1>
    <p>Систематизация знаний Лаборатории Альтернативной Истории</p>
</header>

<div class="controls">
    <button onclick="showAuthors()" id="btn-authors">Авторы</button>
    <button onclick="filterHypotheses('all')" class="active" id="btn-all">Все</button>
    <!-- Кнопки сегментов будут добавлены скриптом -->
</div>

<div id="content-area" class="grid"></div>
<div id="loading" class="loading">Загрузка данных...</div>

<!-- Модальное окно для деталей -->
<div id="detail-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
    const REPO_OWNER = 'qqmats';
    const REPO_NAME = 'lai-hypothesis-bank';
    let allHypotheses = [];
    let allAuthors = [];

    // Инициализация кнопок сегментов
    function initSegmentButtons() {
        const controls = document.querySelector('.controls');
        for (let i = 1; i <= 10; i++) {
            const segId = `SEG${String(i).padStart(2, '0')}`;
            const btn = document.createElement('button');
            btn.innerText = segId;
            btn.onclick = () => filterHypotheses(segId);
            btn.id = `btn-${segId}`;
            controls.appendChild(btn);
        }
    }

    // Загрузка данных
    async function loadData() {
        try {
            // 1. Получаем список файлов гипотез
            const hypRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/hypotheses`);
            const segments = await hypRes.json();
            
            // 2. Параллельно загружаем авторов и все JSON-файлы гипотез
            const authorPromises = [];
            const hypPromises = [];

            // Загрузка авторов
            try {
                const authRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/authors`);
                if (authRes.ok) {
                    const authorsList = await authRes.json();
                    authorsList.forEach(file => {
                        if (file.name.endsWith('.json')) {
                            authorPromises.push(fetch(file.download_url).then(r => r.json()));
                        }
                    });
                }
            } catch (e) { console.log("Папка authors не найдена или пуста"); }

            // Загрузка гипотез по сегментам
            segments.forEach(seg => {
                if (seg.type === 'dir') {
                    hypPromises.push(
                        fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${seg.path}`)
                        .then(r => r.json())
                        .then(files => {
                            return Promise.all(files.filter(f => f.name.endsWith('.json')).map(f => 
                                fetch(f.download_url).then(r => r.json())
                            ));
                        })
                    );
                }
            });

            const [authorsData, hypDataNested] = await Promise.all([
                Promise.all(authorPromises),
                Promise.all(hypPromises)
            ]);

            allAuthors = authorsData;
            allHypotheses = hypDataNested.flat();
            
            document.getElementById('loading').style.display = 'none';
            showAuthors(); // По умолчанию показываем авторов
        } catch (error) {
            document.getElementById('loading').innerText = 'Ошибка загрузки данных. Проверьте консоль.';
            console.error(error);
        }
    }

    // Отображение авторов
    function showAuthors() {
        setActiveButton('btn-authors');
        const container = document.getElementById('content-area');
        container.innerHTML = '';
        
        allAuthors.sort((a, b) => a.personal_info.name_ru.localeCompare(b.personal_info.name_ru));

        allAuthors.forEach(author => {
            const count = allHypotheses.filter(h => 
                h.authors.some(a => a.id === author.id)
            ).length;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>${author.personal_info.name_ru}</h3>
                <p style="color: #7f8c8d;">${author.role_in_lai.join(', ')}</p>
                <div class="tag">Гипотез: ${count}</div>
            `;
            card.onclick = () => showAuthorDetails(author);
            container.appendChild(card);
        });
    }

    // Детали автора
    function showAuthorDetails(author) {
        const modalBody = document.getElementById('modal-body');
        const authorHyps = allHypotheses.filter(h => h.authors.some(a => a.id === author.id));
        
        let html = `<h2>${author.personal_info.name_ru}</h2>`;
        html += `<p><b>Специализация:</b> ${author.specialization.join(', ')}</p>`;
        html += `<p>${author.bio_summary}</p>`;
        html += `<hr><h3>Гипотезы автора:</h3><div class="grid">`;
        
        authorHyps.forEach(h => {
            html += `
                <div class="card status-${h.status}" onclick="openModal('${h.id}')">
                    <h4>${h.title}</h4>
                    <div class="tag">${h.domain}</div>
                </div>
            `;
        });
        html += '</div>';
        
        modalBody.innerHTML = html;
        document.getElementById('detail-modal').style.display = 'block';
    }

    // Фильтрация гипотез
    function filterHypotheses(segment) {
        setActiveButton(segment === 'all' ? 'btn-all' : `btn-${segment}`);
        const container = document.getElementById('content-area');
        container.innerHTML = '';

        const filtered = segment === 'all' 
            ? allHypotheses 
            : allHypotheses.filter(h => h.id.includes(segment));

        filtered.forEach(h => {
            const card = document.createElement('div');
            card.className = `card status-${h.status}`;
            card.innerHTML = `
                <h3>${h.title}</h3>
                <p>${h.hypothesis_statement.substring(0, 100)}...</p>
                <div class="tag">${h.domain}</div>
                <div class="tag" style="background:#dfe6e9">${h.id.split('-')[1].split('_')[0]}</div>
            `;
            card.onclick = () => openModal(h.id);
            container.appendChild(card);
        });
    }

    // Утилиты
    function setActiveButton(id) {
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function openModal(id) {
        const h = allHypotheses.find(item => item.id === id);
        if (!h) return;
        
        const modalBody = document.getElementById('modal-body');
        modalBody.innerHTML = `
            <h2>${h.title}</h2>
            <p><b>ID:</b> ${h.id} | <b>Статус:</b> ${h.status}</p>
            <p><b>Формулировка:</b> ${h.hypothesis_statement}</p>
            <p><b>Описание:</b> ${h.synopsis}</p>
            <p><b>Критерии подтверждения:</b></p>
            <ul>${h.confirmation_criteria.map(c => `<li>${c.description}</li>`).join('')}</ul>
        `;
        document.getElementById('detail-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('detail-modal').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('detail-modal')) closeModal();
    }

    initSegmentButtons();
    loadData();
</script>

</body>
</html>
