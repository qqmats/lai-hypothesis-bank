<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк гипотез ЛАИ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 0.9em; }
        
        /* Навигация */
        .nav-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .nav-btn {
            padding: 8px 16px; border: none; background-color: #e0e0e0; cursor: pointer; border-radius: 20px;
            transition: all 0.3s ease; font-weight: 600; color: #555;
        }
        .nav-btn:hover { background-color: #d0d0d0; }
        .nav-btn.active { background-color: #3498db; color: white; box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3); }
        
        /* Контейнер карточек */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card {
            background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s; border-left: 5px solid #3498db; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .card-id { font-size: 0.75em; color: #95a5a6; font-family: monospace; }
        .card-title { font-size: 1.1em; font-weight: bold; margin: 0 0 10px 0; color: #2c3e50; }
        .card-synopsis { font-size: 0.9em; line-height: 1.5; color: #555; flex-grow: 1; margin-bottom: 15px; }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
        .tag { font-size: 0.75em; background: #ecf0f1; padding: 3px 8px; border-radius: 4px; color: #7f8c8d; }
        
        /* Модальное окно */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; margin: 10% auto; padding: 30px; width: 80%; max-width: 600px; border-radius: 10px; position: relative; }
        .close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
        .close:hover { color: #333; }
        
        /* Статус загрузки */
        #loading { text-align: center; color: #7f8c8d; margin-top: 20px; }
        
        /* Пароль (скрытый) */
        .admin-panel { text-align: center; margin-top: 40px; opacity: 0.3; transition: opacity 0.3s; }
        .admin-panel:hover { opacity: 1; }
        input[type="password"] { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<header>
    <h1>🏛️ Банк гипотез ЛАИ</h1>
    <div class="subtitle">Систематизация знаний Лаборатории Альтернативной Истории 7</div>
</header>

<div class="nav-bar" id="navBar">
    <!-- Кнопки будут сгенерированы JS -->
</div>

<div id="loading">Загрузка гипотез...</div>
<div class="grid" id="cardGrid"></div>

<!-- Модальное окно для деталей -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle"></h2>
        <p id="modalId" style="color: #7f8c8d; font-family: monospace;"></p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <p id="modalStatement" style="font-style: italic; color: #2c3e50;"></p>
        <p id="modalSynopsis"></p>
        <div id="modalAuthors" style="margin-top: 15px; font-size: 0.9em;"></div>
    </div>
</div>

<div class="admin-panel">
    <input type="password" id="editPass" placeholder="Пароль редактора" onchange="checkPass()">
</div>

<script>
    const REPO_OWNER = 'qqmats';
    const REPO_NAME = 'lai-hypothesis-bank';
    const BRANCH = 'main';
    
    let allHypotheses = [];
    let currentFilter = 'all';

    // Инициализация навигации
    function initNav() {
        const nav = document.getElementById('navBar');
        const segments = [
            { id: 'all', name: 'Все' },
            { id: 'authors', name: 'Авторы' }, // Новая кнопка
            { id: 'SEG01', name: 'Мегалиты' },
            { id: 'SEG02', name: 'Геоинженерия' },
            { id: 'SEG03', name: 'Артефакты' },
            { id: 'SEG04', name: 'Биология' },
            { id: 'SEG05', name: 'Физика' },
            { id: 'SEG06', name: 'Биоинженерия' },
            { id: 'SEG07', name: 'IT' },
            { id: 'SEG08', name: 'Социум' },
            { id: 'SEG09', name: 'Резерв' },
            { id: 'SEG10', name: 'Фундамент' }
        ];

        segments.forEach(seg => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            if (seg.id === 'all') btn.classList.add('active');
            btn.innerText = seg.name;
            btn.onclick = () => filterData(seg.id, btn);
            nav.appendChild(btn);
        });
    }

    async function loadData() {
        try {
            // Получаем список файлов из папки hypotheses
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`);
            const tree = await response.json();
            
            const jsonFiles = tree.tree.filter(item => 
                item.path.startsWith('hypotheses/') && item.path.endsWith('.json')
            );

            for (const file of jsonFiles) {
                try {
                    const contentResp = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${file.path}`);
                    const text = await contentResp.text();
                    // Игнорируем ошибки парсинга, как просили
                    try {
                        const data = JSON.parse(text);
                        allHypotheses.push(data);
                    } catch (e) {
                        console.warn(`Ошибка парсинга в файле ${file.path}:`, e);
                    }
                } catch (err) {
                    console.error(`Не удалось загрузить ${file.path}`, err);
                }
            }
            
            document.getElementById('loading').style.display = 'none';
            renderCards(allHypotheses);
        } catch (error) {
            document.getElementById('loading').innerText = 'Ошибка загрузки данных. Проверьте консоль.';
            console.error(error);
        }
    }

    function renderCards(data) {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';
        
        data.forEach(hyp => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => showDetails(hyp);
            
            const authors = hyp.authors ? hyp.authors.map(a => a.name).join(', ') : 'Неизвестно';
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-id">${hyp.id || 'NO-ID'}</span>
                </div>
                <h3 class="card-title">${hyp.title || 'Без названия'}</h3>
                <p class="card-synopsis">${hyp.synopsis ? hyp.synopsis.substring(0, 100) + '...' : ''}</p>
                <div class="tags">
                    <span class="tag">${authors}</span>
                    <span class="tag">${hyp.status || 'draft'}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterData(filterId, btnElement) {
        currentFilter = filterId;
        
        // Обновление активной кнопки
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        if (filterId === 'all') {
            renderCards(allHypotheses);
        } else if (filterId === 'authors') {
            // Здесь будет логика отображения авторов
            alert('Раздел "Авторы" находится в разработке. Скоро здесь появится список исследователей.');
        } else {
            const filtered = allHypotheses.filter(h => h.id && h.id.includes(filterId));
            renderCards(filtered);
        }
    }

    function showDetails(hyp) {
        document.getElementById('modalTitle').innerText = hyp.title;
        document.getElementById('modalId').innerText = hyp.id;
        document.getElementById('modalStatement').innerText = hyp.hypothesis_statement || '';
        document.getElementById('modalSynopsis').innerText = hyp.synopsis || '';
        
        const authorsDiv = document.getElementById('modalAuthors');
        if (hyp.authors) {
            authorsDiv.innerHTML = '<strong>Авторы:</strong> ' + hyp.authors.map(a => a.name).join(', ');
        }
        
        document.getElementById('detailModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function checkPass() {
        const pass = document.getElementById('editPass').value;
        if (pass === 'LAI_Admin_2026') { // Пример пароля
            alert('Режим редактирования активирован!');
            // Здесь можно добавить логику для появления кнопок редактирования
        }
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('detailModal')) {
            closeModal();
        }
    }

    // Запуск
    initNav();
    loadData();
</script>

</body>
</html>
