        pre { background: #fff; padding: 15px; margin: 0; overflow-x: auto; font-size: 0.9em; line-height: 1.5; }
        #status { margin-left: 10px; font-style: italic; color: #666; }

    let fullContentText = "";

    async function loadAllData() {
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const snapBtn = document.getElementById('snapBtn');
        
        output.innerHTML = '<p>⏳ Загрузка и обработка файлов...</p>';
        status.innerText = "Загрузка...";
        fullContentText = "# LAI HYPOTHESIS BANK - RAW DATA SNAPSHOT\n\n";

        let resultHTML = "";

        // Вспомогательная функция для fetch
        async function fetchAndRender(files, title) {
            let html = `<div class="section-title">${title}</div>`;
            for (const file of files) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) continue;
                    const data = await response.json();
                    
                    // Добавляем в HTML для просмотра
                    html += `
                        <div class="file-block">
                            <div class="file-path">${file}</div>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>`;
                    
                    // Добавляем в текстовый формат для AI
                    fullContentText += `## FILE: ${file}\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\`\n\n`;
                } catch (e) { console.error(e); }
            }
            return html;
        }

        status.innerText = "Готово! Данные загружены.";
        snapBtn.disabled = false;
    }

    function createSnapshot() {
        // Создаем простой HTML файл, где весь текст уже внутри
        const snapshotContent = `
        <!DOCTYPE html>
        <body style="font-family: monospace; white-space: pre-wrap;">
        <h1>LAI Bank Static Snapshot</h1>
        ${fullContentText.replace(/\n/g, '<br>').replace(/ /g, '&nbsp;')}
        </body></html>`;
        
        const blob = new Blob([snapshotContent], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lai_data_snapshot.html';
        a.click();
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(fullContentText).then(() => {
            alert('Текстовая версия скопирована!');
        });
