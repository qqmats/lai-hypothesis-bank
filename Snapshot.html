<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LAI Data Snapshot Generator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f6f8; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .controls { margin: 20px 0; padding: 15px; background: #eef2f7; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-load { background: #3498db; color: white; }
        .btn-save { background: #27ae60; color: white; }
        .btn-copy { background: #7f8c8d; color: white; }
        #log { margin-top: 20px; font-family: monospace; font-size: 0.9em; color: #555; white-space: pre-wrap; background: #fafafa; padding: 10px; border: 1px solid #eee; max-height: 400px; overflow-y: auto; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 LAI Bank: Static Snapshot Generator</h1>
    <p>Этот инструмент собирает все данные из JSON-файлов в один HTML-документ для анализа нейросетями.</p>
    
    <div class="controls">
        <button class="btn-load" onclick="generateSnapshot()">1. Собрать данные</button>
        <button class="btn-save" onclick="downloadFile()" id="saveBtn" disabled>2. Скачать файл</button>
        <button class="btn-copy" onclick="copyText()" id="copyBtn" disabled>3. Копировать текст</button>
    </div>

    <div id="log">Нажмите "Собрать данные", чтобы начать...</div>
</div>

<script>
    // ВАЖНО: Убедитесь, что эти пути точно совпадают с именами файлов в вашем репозитории!
    const hypothesisFiles = [
        "hypotheses/SEG01/LAI_SEG01-Sergeev_01.json",
        // Добавьте сюда остальные гипотезы
    ];

    const authorFiles = [
        "authors/Sklyarov.json",
        "authors/AUTH-Siparov.json"
        // Добавьте сюда остальных авторов
    ];

    let finalContent = "";

    function log(msg, type = 'normal') {
        const logDiv = document.getElementById('log');
        const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
        logDiv.innerHTML += `<div class="${className}">${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function generateSnapshot() {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = ""; 
        finalContent = "# LAI HYPOTHESIS BANK - FULL DATA DUMP\n\n";
        
        document.getElementById('saveBtn').disabled = true;
        document.getElementById('copyBtn').disabled = true;

        const allFiles = [...hypothesisFiles, ...authorFiles];
        let successCount = 0;

        for (const file of allFiles) {
            try {
                log(`Загрузка: ${file}...`);
                const response = await fetch(file);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                finalContent += `## FILE PATH: ${file}\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\`\n\n`;
                successCount++;
                log(`✅ Успешно: ${file}`, 'success');
            } catch (error) {
                log(`❌ Ошибка загрузки ${file}: ${error.message}`, 'error');
            }
        }

        if (successCount > 0) {
            log(`\n🎉 Готово! Обработано файлов: ${successCount}. Теперь можно скачать или скопировать текст.`, 'success');
            document.getElementById('saveBtn').disabled = false;
            document.getElementById('copyBtn').disabled = false;
        } else {
            log("\n⚠️ Не удалось загрузить ни одного файла. Проверьте пути в коде и запущен ли сайт на GitHub Pages.", 'error');
        }
    }

    function downloadFile() {
        if (!finalContent) return;
        
        // Создаем простой HTML, который нейросеть легко прочитает
        const htmlContent = `
        <!DOCTYPE html>
        <body style="font-family: monospace; white-space: pre-wrap; padding: 20px;">
        <h1>LAI Data Snapshot</h1>
        <pre>${finalContent.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
        </body></html>`;

        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lai_full_snapshot.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function copyText() {
        if (!finalContent) return;
        navigator.clipboard.writeText(finalContent).then(() => {
            alert('Текст скопирован в буфер обмена!');
        }).catch(err => {
            log('Ошибка копирования: ' + err, 'error');
        });
    }
</script>

</body>
</html>
